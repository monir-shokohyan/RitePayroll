<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logoapple.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="task management" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload"
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Roboto:wght@400;500;600;700;800&display=swap"
    as="style" onload="this.onload=null;this.rel='stylesheet'" crossorigin />
  <link rel="preload" as="image" href="/welcome.svg" fetchpriority="high" />
  <link rel="preload" as="image" href="/bgNet.webp" fetchpriority="high" />
  <link rel="preload" as="image" href="/lotus logo.webp" fetchpriority="high" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Roboto:wght@400;500;600;700;800&display=swap"
      crossorigin>
  </noscript>
  <title>Lotus Soft Technologies Ltd.</title>
  <style>
    .fallback-loader {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      background: #fff;
      z-index: 9999;
    }

    .mantine-oval-loader {
      width: 40px;
      height: 40px;
      border: 4px solid #15b3e0;
      border-top: 4px solid transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    #root:not(:empty)+.fallback-loader {
      display: none;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <div class="fallback-loader">
    <div class="mantine-oval-loader"></div>
  </div>
  <script rel="preload" type="module" src="/src/app/main.tsx"></script>
</body>

</html>
